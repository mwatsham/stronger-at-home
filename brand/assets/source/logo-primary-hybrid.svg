<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 340" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Stronger at Home Physiotherapy by Melanie Watsham</title>
  <desc id="logo-description">An open-bottom home above a supporting outlined hand, with a moving person and three ascending steps, beside the Stronger at Home Physiotherapy wordmark.</desc>
  <defs>
    <style>
      @font-face {
        font-family: "Source Serif 4";
        src: url("../../fonts/source-serif-4.ttf") format("truetype");
        font-style: normal;
        font-weight: 400 600;
      }
      @font-face {
        font-family: "Atkinson Hyperlegible Next";
        src: url("../../fonts/atkinson-hyperlegible-next.ttf") format("truetype");
        font-style: normal;
        font-weight: 400 600;
      }
      .wordmark-primary {
        font-family: "Source Serif 4", serif;
        font-size: 76px;
        font-weight: 600;
        letter-spacing: -1.2px;
      }
      .wordmark-secondary {
        font-family: "Source Serif 4", serif;
        font-size: 64px;
        font-weight: 400;
        letter-spacing: 0.2px;
      }
      .endorsement {
        font-family: "Atkinson Hyperlegible Next", sans-serif;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <g id="supplied-reference-symbol" transform="translate(12 4)">
    <path d="M42 226 V116 L146 30 L250 116 V226" fill="none" stroke="#203E55" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M198 73 V51 H219 V91" fill="none" stroke="#203E55" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <g id="moving-person" fill="none" stroke="#203E55" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="112" cy="108" r="12" fill="#203E55" stroke="none"/>
      <path d="M108 137 L132 164"/>
      <path d="M108 141 L89 165 M121 149 L151 157"/>
      <path d="M132 164 L118 205"/>
      <path d="M132 164 L169 181 L164 212"/>
    </g>

    <g id="progression-steps" fill="#C3A26E">
      <rect x="88" y="213" width="46" height="12" rx="6"/>
      <rect x="145" y="178" width="46" height="12" rx="6"/>
      <rect x="202" y="143" width="42" height="12" rx="6"/>
    </g>

    <path d="M38 281 C61 247 89 237 120 244 C151 252 176 251 201 239 C215 232 225 240 213 251 C200 262 181 267 161 265 C182 274 203 274 222 264 L263 232 C273 224 283 234 274 243 L241 273 L281 244 C292 237 301 249 291 258 L253 286 L298 261 C309 255 317 268 306 276 L266 305 C231 330 186 335 142 324 L91 309 L42 309 Z" fill="none" stroke="#203E55" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#203E55">
    <text class="wordmark-primary" x="330" y="132">Stronger at Home</text>
    <text class="wordmark-secondary" x="332" y="207">Physiotherapy</text>
    <text class="endorsement" x="334" y="258">by Melanie Watsham</text>
  </g>
</svg>
